<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LunaGuard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #521684 0%, #1c052f 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container { text-align: center; }
        h1 { font-size: 48px; margin-bottom: 10px; }
        .luna { color: #e1c8f5; }
        .guard { color: #ac78cf; }
        p { font-size: 18px; color: #e0c8c4; }
    </style>
</head>
<body>
<div class="container">
    <h1><span class="luna">luna</span><span class="guard">guard</span></h1>
    <p>Safety that never sleeps.</p>
</div>
</body>
</html>
